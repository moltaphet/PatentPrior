[project]
name = "patent-prior"
version = "0.1.0"
description = "PatentPrior: autonomous patent prior-art adjudication on GenLayer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "genlayer-test==0.30.0rc2",
    "genlayer-py==0.19.0rc2",
    "genvm-linter==0.11.1rc2",
    "pytest==9.1.1",
    "web3==8.0.0",
    "eth-account==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
enable_assertion_pass_hook = true

[tool.ruff]
line-length = 110
